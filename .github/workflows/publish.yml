name: Publish Release

on:
  push:
    tags:
      - 'v*'
      - '[0-9]*'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Release AARs & Publish
        run: ./gradlew publishToMavenLocal assembleRelease :tracea-gradle-plugin:publishToMavenLocal :tracea-gradle-plugin:jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            tracea/build/outputs/aar/*.aar
            tracea-core/build/outputs/aar/*.aar
            tracea-okhttp/build/outputs/aar/*.aar
            tracea-manual/build/outputs/aar/*.aar
            tracea-storage/build/outputs/aar/*.aar
            tracea-ui/build/outputs/aar/*.aar
            tracea-urlconnection/build/outputs/aar/*.aar
            tracea-noop/build/outputs/aar/*.aar
            tracea-web/build/outputs/aar/*.aar
            tracea-gradle-plugin/build/libs/*.jar
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
